    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

    @keyframes fadeOutDisappear {
      0% { opacity: 1; transform: scale(1); max-height: 140px; margin-bottom: 12px; }
      50% { opacity: 0.3; transform: scale(0.95); }
      100% { opacity: 0; transform: scale(0.85); max-height: 0px; margin-bottom: 0px; padding: 0px; }

    .qr-laser-line {

      left: 0;
      width: 100%;

      background: linear-gradient(90deg, transparent, #22c55e, #86efac, #22c55e, transparent);

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Web Audio Chime Sound
    const playSuccessChime = () => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        }
      } catch (e) {}
    };

    // --- BOOKS CATALOG ACROSS ALL REQUESTED CATEGORIES ---

      { id: 'b-103', title: 'A Modern Approach to Verbal & Non-Verbal Reasoning', author: 'Dr. R.S. Aggarwal', category: 'Government Jobs', copies: 5, availableCopies: 2, shelf: 'Rack GJ-03 (Floor 1)', shelfStatus: 'Needs Rearranging', cover: 'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=400&auto=format&fit=crop&q=80', description: 'Comprehensive logical reasoning guide covering analytical puzzles, syllogisms, and series for competitive exams.' },

      // CURRENT AFFAIRS
      { id: 'b-201', title: 'Manorama Yearbook 2026: Comprehensive General Knowledge', author: 'Mammen Mathew', category: 'Current Affairs', copies: 10, availableCopies: 7, shelf: 'Rack CA-01 (Floor 1)', shelfStatus: 'Arranged', cover: 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=400&auto=format&fit=crop&q=80', description: 'Up-to-date global affairs, science achievements, national summits, awards, sports, and international diplomacy review.' },
      { id: 'b-202', title: 'India 2026: Annual Reference Manual', author: 'Publications Division, Govt of India', category: 'Current Affairs', copies: 6, availableCopies: 4, shelf: 'Rack CA-02 (Floor 1)', shelfStatus: 'Arranged', cover: 'https://images.unsplash.com/photo-1526470608268-f674ce90ebd4?w=400&auto=format&fit=crop&q=80', description: 'Official government compilation of national welfare schemes, ministries, economic data, and census indicators.' },
      { id: 'b-203', title: 'Pratiyogita Darpan: Monthly Current Affairs & Policy Round', author: 'Editorial Board', category: 'Current Affairs', copies: 7, availableCopies: 0, shelf: 'Rack CA-03 (Floor 1)', shelfStatus: 'Needs Rearranging', cover: 'https://images.unsplash.com/photo-1495020689067-958852a7765e?w=400&auto=format&fit=crop&q=80', description: 'Monthly analytical magazine highlighting national economic developments, science breakthroughs, and interview preparation.' },

      // EDUCATION
      { id: 'b-301', title: 'Clean Code: A Handbook of Agile Software Craftsmanship', author: 'Robert C. Martin', category: 'Education', copies: 7, availableCopies: 4, shelf: 'Rack ED-01 (Floor 2)', shelfStatus: 'Arranged', cover: 'https://images.unsplash.com/photo-1516259762381-22954d7d3ad2?w=400&auto=format&fit=crop&q=80', description: 'Standard software engineering text on writing readable, reusable, clean and bug-free code.' },
      { id: 'b-302', title: 'Introduction to Algorithms (CLRS)', author: 'Thomas H. Cormen, Charles E. Leiserson', category: 'Education', copies: 8, availableCopies: 3, shelf: 'Rack ED-02 (Floor 2)', shelfStatus: 'Arranged', cover: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=400&auto=format&fit=crop&q=80', description: 'The golden standard textbook for Data Structures, Graph Theory, Dynamic Programming and Algorithms.' },
      { id: 'b-303', title: 'Artificial Intelligence: A Modern Approach', author: 'Stuart Russell & Peter Norvig', category: 'Education', copies: 6, availableCopies: 4, shelf: 'Rack ED-03 (Floor 2)', shelfStatus: 'Needs Rearranging', cover: 'https://images.unsplash.com/photo-1620712943543-bcc4688e7485?w=400&auto=format&fit=crop&q=80', description: 'Comprehensive university text on intelligent agents, neural networks, machine learning and robotics.' },

      // STORIES & NOVELS
      { id: 'b-401', title: 'Atomic Habits: Tiny Changes, Remarkable Results', author: 'James Clear', category: 'Stories & Novels', copies: 9, availableCopies: 5, shelf: 'Rack ST-01 (Floor 2)', shelfStatus: 'Arranged', cover: 'https://images.unsplash.com/photo-1544717305-2782549b5136?w=400&auto=format&fit=crop&q=80', description: 'Inspiring real-life stories and practical behavioral framework on how small 1% habits lead to massive success.' },
      { id: 'b-402', title: 'The Alchemist', author: 'Paulo Coelho', category: 'Stories & Novels', copies: 8, availableCopies: 5, shelf: 'Rack ST-02 (Floor 2)', shelfStatus: 'Arranged', cover: 'https://images.unsplash.com/photo-1476275466078-4007374efbbe?w=400&auto=format&fit=crop&q=80', description: 'The magical story of Santiago, an Andalusian shepherd boy who journeys to the Egyptian pyramids in search of treasure.' },
      { id: 'b-403', title: 'Barrister Parvateesam (బారిస్టర్ పార్వతీశం)', author: 'Mokkapati Narasimha Sastry', category: 'Stories & Novels', copies: 5, availableCopies: 3, shelf: 'Rack ST-03 (Floor 2)', shelfStatus: 'Needs Rearranging', cover: 'https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400&auto=format&fit=crop&q=80', description: 'Classic humorous Telugu literary novel detailing the adventurous and witty journey of Parvateesam to England.' }
    ];

    function App() {
      // --- AUTH STATE ---
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        const saved = localStorage.getItem('smart_lib_auth_state_v7');
        return saved ? JSON.parse(saved) : true;
      });

      const [authMode, setAuthMode] = useState('login');
      const [loginRoleTab, setLoginRoleTab] = useState('student');

      // Current Logged-in User
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('smart_lib_user_profile_v7');
        return saved ? JSON.parse(saved) : {
          role: 'student',
          name: 'Ramya Sri',
          id: '2026-CS-042',
          title: 'Student Member',
          email: 'ramya.sri@college.edu'
        };
      });

      // Active Tab
      const [activeTab, setActiveTab] = useState('student_scanner');

      // Books Catalog
      const [books, setBooks] = useState(() => {
        const saved = localStorage.getItem('smart_lib_catalog_v7');
        return saved ? JSON.parse(saved) : INITIAL_CATALOG;
      });

      // Student Borrow Requests Queue
      const [requests, setRequests] = useState(() => {
        const saved = localStorage.getItem('smart_lib_requests_v7');
        return saved ? JSON.parse(saved) : [
          {
            id: 'req-1',
            studentName: 'Ramya Sri',
            studentRoll: '2026-CS-042',
            bookId: 'b-101',
            bookTitle: 'Indian Polity (6th Edition)',
            author: 'M. Laxmikanth',
            requestedAt: 'Today, 10:15 AM',
            status: 'pending'
          }
        ];
      });

      // Employee Restock Requests Queue to Admin
      // [{ id, bookId, bookTitle, author, category, requestedBy, empId, requestedAt, addedCopies: 5, status: 'pending' | 'restocked' }]
      const [restockRequests, setRestockRequests] = useState(() => {
        const saved = localStorage.getItem('smart_lib_restock_requests_v7');
        return saved ? JSON.parse(saved) : [
          {
            id: 'rstk-101',
            bookId: 'b-104',
            bookTitle: 'General Studies Paper 1 Manual for Civil Services',
            author: 'McGraw Hill',
            category: 'Government Jobs',
            requestedBy: 'Suresh Kumar',
            empId: 'LIB-EMP-108',
            requestedAt: 'Today, 11:05 AM',
            addedCopies: 5,
            status: 'pending'
          }
        ];
      });

      // Active Loans (2 Days rule)
      const [activeLoans, setActiveLoans] = useState(() => {
        const saved = localStorage.getItem('smart_lib_loans_v7');
        return saved ? JSON.parse(saved) : [
          {
            id: 'loan-1',
            bookId: 'b-401',
            bookTitle: 'Atomic Habits',
            author: 'James Clear',
            borrowDate: '2026-09-01',
            dueDate: '2026-09-03',
            allowedDays: 2,
            studentName: 'Ramya Sri',
            studentRoll: '2026-CS-042',
            status: 'Active'
          }
        ];
      });

      // Student Attendance Logs
      const [attendanceLogs, setAttendanceLogs] = useState(() => {
        const saved = localStorage.getItem('smart_lib_attendance_v7');
        return saved ? JSON.parse(saved) : [
          { id: 'att-101', studentName: 'Ramya Sri', studentRoll: '2026-CS-042', type: 'CHECK-IN', time: '09:15 AM', date: '2026-09-04', status: 'Inside Library' }
        ];
      });

      // Employee / Staff Attendance Logs
      // [{ id, empName, empId, designation, type: 'DUTY CHECK-IN' | 'DUTY CHECK-OUT', time: string, date: string, shift: 'Morning Shift (9 AM - 5 PM)' }]
      const [employeeAttendanceLogs, setEmployeeAttendanceLogs] = useState(() => {
        const saved = localStorage.getItem('smart_lib_emp_attendance_v7');
        return saved ? JSON.parse(saved) : [
          { id: 'emp-att-1', empName: 'Suresh Kumar', empId: 'LIB-EMP-108', designation: 'Library Assistant', type: 'DUTY CHECK-IN', time: '08:55 AM', date: '2026-09-04', shift: 'Morning Shift (9 AM - 5 PM)' }
        ];
      });

      const [isStudentInside, setIsStudentInside] = useState(() => {
        const saved = localStorage.getItem('smart_lib_is_inside_v7');
        return saved !== null ? JSON.parse(saved) : true;
      });

      // Scanner State Machine
      const [isScannerModalOpen, setIsScannerModalOpen] = useState(false);
      const [scannerActionType, setScannerActionType] = useState('CHECK-IN');
      const [scanState, setScanState] = useState('IDLE_WAITING_SCAN');
      const [scanSuccessEvent, setScanSuccessEvent] = useState(null);

      // Filters & Messages
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [toastMsg, setToastMsg] = useState(null);
      const [disappearingReqId, setDisappearingReqId] = useState(null);
      const [disappearingRestockId, setDisappearingRestockId] = useState(null);

      // Persistence
      useEffect(() => {
        localStorage.setItem('smart_lib_auth_state_v7', JSON.stringify(isAuthenticated));
      }, [isAuthenticated]);
      useEffect(() => {
        localStorage.setItem('smart_lib_user_profile_v7', JSON.stringify(currentUser));
      }, [currentUser]);
      useEffect(() => {
        localStorage.setItem('smart_lib_catalog_v7', JSON.stringify(books));
      }, [books]);
      useEffect(() => {
        localStorage.setItem('smart_lib_requests_v7', JSON.stringify(requests));
      }, [requests]);
      useEffect(() => {
        localStorage.setItem('smart_lib_restock_requests_v7', JSON.stringify(restockRequests));
      }, [restockRequests]);
      useEffect(() => {
        localStorage.setItem('smart_lib_loans_v7', JSON.stringify(activeLoans));
      }, [activeLoans]);
      useEffect(() => {
        localStorage.setItem('smart_lib_attendance_v7', JSON.stringify(attendanceLogs));
      }, [attendanceLogs]);
      useEffect(() => {
        localStorage.setItem('smart_lib_emp_attendance_v7', JSON.stringify(employeeAttendanceLogs));
      }, [employeeAttendanceLogs]);
      useEffect(() => {
        localStorage.setItem('smart_lib_is_inside_v7', JSON.stringify(isStudentInside));
      }, [isStudentInside]);

      // Lucide Icons
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const showToast = (message, type = 'success') => {
        setToastMsg({ text: message, type });
        setTimeout(() => setToastMsg(null), 3800);
      };

      const categories = ['ALL', 'Education', 'Current Affairs', 'Government Jobs', 'Stories & Novels'];

      const filteredBooks = useMemo(() => {
        return books.filter(b => {
          const matchCat = selectedCategory === 'ALL' || b.category === selectedCategory;
          const matchQ = !searchQuery || 
            b.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
            b.author.toLowerCase().includes(searchQuery.toLowerCase()) ||
            b.category.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchQ;
        });
      }, [books, selectedCategory, searchQuery]);

      // Fine Engine
      const calculateFine = (borrowDateStr) => {
        const borrowDate = new Date(borrowDateStr);
        const today = new Date('2026-09-04');
        const diffTime = Math.max(0, today - borrowDate);
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        
        if (diffDays > 2) {
          const overdueDays = diffDays - 2;
          return { fine: overdueDays * 20, overdueDays, isOverdue: true };
        }
        return { fine: 0, overdueDays: 0, isOverdue: false };
      };

      const totalStudentFine = useMemo(() => {
        return activeLoans.reduce((sum, loan) => {
          const { fine } = calculateFine(loan.borrowDate);
          return sum + fine;
        }, 0);
      }, [activeLoans]);

      const pendingBorrowRequestsCount = requests.filter(r => r.status === 'pending').length;
      const pendingRestockRequestsCount = restockRequests.filter(r => r.status === 'pending').length;
      const totalAdminNotifications = pendingBorrowRequestsCount + pendingRestockRequestsCount;

      // Switch Role Quick Handler
      const handleRoleSwitch = (role) => {
        if (role === 'student') {
          setCurrentUser({ role: 'student', name: 'Ramya Sri', id: '2026-CS-042', title: 'Student Member', email: 'ramya.sri@college.edu' });
          setActiveTab('student_scanner');
          showToast('Switched to Student Portal');
        } else if (role === 'employee') {
          setCurrentUser({ role: 'employee', name: 'Suresh Kumar', id: 'LIB-EMP-108', title: 'Library Assistant & Staff', email: 'suresh.staff@library.edu' });
          setActiveTab('emp_restock_audit');
          showToast('Switched to Library Employee Portal 👷');
        } else {
          setCurrentUser({ role: 'admin', name: 'Dr. Ramesh Sharma', id: 'LIB-ADM-001', title: 'Chief Librarian / Admin', email: 'admin@library.edu' });
          setActiveTab('admin_restock_requests');
          showToast('Switched to Chief Librarian Admin Portal 🛡️');
        }
      };

      // --- AUTH SUBMIT ---
      const handleAuthSubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const name = fd.get('name') || (loginRoleTab === 'student' ? 'Ramya Sri' : loginRoleTab === 'employee' ? 'Suresh Kumar' : 'Dr. Ramesh Sharma');
        const idNumber = fd.get('idNumber') || (loginRoleTab === 'student' ? '2026-CS-042' : loginRoleTab === 'employee' ? 'LIB-EMP-108' : 'LIB-ADM-001');
        const role = fd.get('role') || loginRoleTab;

        setCurrentUser({
          role,
          name,
          id: idNumber,
          title: role === 'employee' ? 'Library Assistant & Staff' : role === 'admin' ? 'Chief Librarian' : 'Student Member',
          email: fd.get('email') || `${name.toLowerCase().replace(/\s+/g, '')}@library.edu`
        });

        setIsAuthenticated(true);
        if (role === 'employee') setActiveTab('emp_restock_audit');
        else if (role === 'admin') setActiveTab('admin_restock_requests');
        else setActiveTab('student_scanner');

        showToast(`🎉 Logged in successfully as ${name} (${role.toUpperCase()})`);
        if (window.confetti) window.confetti({ particleCount: 60, spread: 60 });
      };

      // --- SCANNER MODAL CONTROLS ---
      const openScanner = (type) => {
        setScannerActionType(type);
        setScanState('IDLE_WAITING_SCAN');
        setIsScannerModalOpen(true);
      };

      const closeScanner = () => {
        setIsScannerModalOpen(false);
        setScanState('IDLE_WAITING_SCAN');
      };

      const handleTriggerPhoneScan = () => {
        playSuccessChime();
        setScanState('SCAN_DETECTED');
        showToast('📱 Phone Scan Detected! Verifying Student ID...');
      };

      const handleCompleteScanDone = () => {
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const dateStr = now.toISOString().split('T')[0];

        const isCheckIn = scannerActionType === 'CHECK-IN';
        setIsStudentInside(isCheckIn);

        const newAttendanceEntry = {
          id: 'att-' + Date.now(),
          studentName: currentUser.name,
          studentRoll: currentUser.id,
          type: isCheckIn ? 'CHECK-IN' : 'CHECK-OUT',
          time: timeStr,
          date: dateStr,
          status: isCheckIn ? 'Inside Library' : 'Checked Out'
        };

        setAttendanceLogs(prev => [newAttendanceEntry, ...prev]);

        setScanSuccessEvent({
          type: isCheckIn ? 'CHECK-IN' : 'CHECK-OUT',
          name: currentUser.name,
          roll: currentUser.id,
          time: timeStr,
          date: dateStr
        });

        closeScanner();
        if (window.confetti) window.confetti({ particleCount: 80, spread: 70 });
      };

      // Render Clean High-Res QR Code (Option A)
      useEffect(() => {
        const container = document.getElementById('phone-scan-qrcode-only');
        if (container) {
          container.innerHTML = '';
          if (window.QRCode) {
            new QRCode(container, {
              text: `GATE_${scannerActionType}_${currentUser.name.replace(/\s+/g, '_')}_${currentUser.id}_${Date.now()}`,
              width: 180,
              height: 180,
              colorDark: '#090e1a',
              colorLight: '#ffffff',
              correctLevel: QRCode.CorrectLevel.H
            });
          }
        }
      }, [isScannerModalOpen, scannerActionType]);

      // --- EMPLOYEE DUTY ATTENDANCE ACTION ---
      const handleEmployeeDutyAttendance = (type) => {
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const dateStr = now.toISOString().split('T')[0];

        const newEmpLog = {
          id: 'emp-att-' + Date.now(),
          empName: currentUser.name,
          empId: currentUser.id,
          designation: 'Library Assistant',
          type,
          time: timeStr,
          date: dateStr,
          shift: 'Morning Shift (9 AM - 5 PM)'
        };

        setEmployeeAttendanceLogs(prev => [newEmpLog, ...prev]);
        showToast(`👷 ${type} marked at ${timeStr}! Saved to Admin Duty Registry.`);
        if (window.confetti) window.confetti({ particleCount: 50, spread: 50 });
      };

      // --- EMPLOYEE SENDS RESTOCK REQUEST TO ADMIN ---
      const handleEmployeeSendRestockRequest = (book) => {
        const isAlreadyRequested = restockRequests.some(r => r.bookId === book.id && r.status === 'pending');
        if (isAlreadyRequested) {
          showToast(`⚠️ Restock request for "${book.title}" is already sent to Admin!`, 'info');
          return;
        }

        const newRestockReq = {
          id: 'rstk-' + Date.now(),
          bookId: book.id,
          bookTitle: book.title,
          author: book.author,
          category: book.category,
          requestedBy: currentUser.name,
          empId: currentUser.id,
          requestedAt: 'Just now',
          addedCopies: 5,
          status: 'pending'
        };

        setRestockRequests(prev => [newRestockReq, ...prev]);
        showToast(`🔔 Restock notification sent to Admin for "${book.title}"! (+5 Copies Requested)`);
        playSuccessChime();
      };

      // --- ADMIN APPROVES & RESTOCKS STOCK (DISAPPEARS & INCREMENTS) ---
      const handleAdminExecuteRestock = (req) => {
        setDisappearingRestockId(req.id);

        setTimeout(() => {
          // Increment book stock by 5 copies
          setBooks(prev => prev.map(b => {
            if (b.id === req.bookId) {
              return {
                ...b,
                copies: b.copies + req.addedCopies,
                availableCopies: b.availableCopies + req.addedCopies,
                shelfStatus: 'Arranged'
              };
            }
            return b;
          }));

          // Remove from restock requests (Disappears!)
          setRestockRequests(prev => prev.filter(r => r.id !== req.id));
          setDisappearingRestockId(null);
          showToast(`📦 Restocked +${req.addedCopies} copies for "${req.bookTitle}"! Stock is now live.`);

          if (window.confetti) {
            window.confetti({ particleCount: 75, spread: 65, origin: { y: 0.5 } });
          }
        }, 400);
      };

      // --- STUDENT BORROW REQUEST ACTIONS ---
      const handleSendBorrowRequest = (book) => {
        if (!isStudentInside) {
          showToast('⚠️ Please scan Check-In at the gate before requesting books!', 'error');
          return;
        }
        if (book.availableCopies <= 0) {
          showToast(`❌ "${book.title}" is out of stock! Staff will request Admin to restock.`, 'error');
          return;
        }
        const alreadyReq = requests.some(r => r.bookId === book.id && r.status === 'pending');
        if (alreadyReq) {
          showToast(`⚠️ Request for "${book.title}" is already pending approval!`, 'info');
          return;
        }

        const newReq = {
          id: 'req-' + Date.now(),
          studentName: currentUser.name,
          studentRoll: currentUser.id,
          bookId: book.id,
          bookTitle: book.title,
          author: book.author,
          requestedAt: 'Just now',
          status: 'pending'
        };

        setRequests(prev => [newReq, ...prev]);
        showToast(`📨 Borrow request for "${book.title}" sent to Admin!`);
      };

      const handleAdminApprove = (req) => {
        setDisappearingReqId(req.id);
        setTimeout(() => {
          setBooks(prev => prev.map(b => b.id === req.bookId ? { ...b, availableCopies: Math.max(0, b.availableCopies - 1) } : b));
          setRequests(prev => prev.filter(r => r.id !== req.id));

          const today = new Date();
          const dueDate = new Date();
          dueDate.setDate(today.getDate() + 2);

          const newLoan = {
            id: 'loan-' + Date.now(),
            bookId: req.bookId,
            bookTitle: req.bookTitle,
            author: req.author,
            borrowDate: today.toISOString().split('T')[0],
            dueDate: dueDate.toISOString().split('T')[0],
            allowedDays: 2,
            studentName: req.studentName,
            studentRoll: req.studentRoll,
            status: 'Approved & Issued'
          };

          setActiveLoans(prev => [newLoan, ...prev]);
          setDisappearingReqId(null);
          showToast(`✅ Approved request for "${req.bookTitle}"! Student can collect the book.`);
          if (window.confetti) window.confetti({ particleCount: 60, spread: 55 });
        }, 400);
      };

      const handleAdminReject = (req) => {
        setDisappearingReqId(req.id);
        setTimeout(() => {
          setRequests(prev => prev.filter(r => r.id !== req.id));
          setDisappearingReqId(null);
          showToast(`❌ Request for "${req.bookTitle}" rejected.`, 'info');

                            {pendingRestockRequestsCount > 0 && (
                              <span className="text-xs bg-rose-500 text-white font-bold px-3 py-1 rounded-full animate-bounce">
                                {pendingRestockRequestsCount} Stock Alerts
                              </span>
                            )}
                          </h2>
                          <p className="text-slate-400 text-sm mt-1">
                            Library Employees audit stock and send restock requests when copies run out. Click <strong>"Approve & Restock (+5 Copies)"</strong> to fulfill.
                          </p>
                        </div>
                      </div>

                      <div className="space-y-4">
                        {restockRequests.length === 0 ? (
                          <div className="p-12 rounded-3xl bg-slate-900/60 border border-slate-800 text-center space-y-3">
                            <div className="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center mx-auto">
                              <i data-lucide="check-check" className="w-6 h-6"></i>
                            </div>
                            <h3 className="font-bold text-base text-white">All stock requests fulfilled!</h3>
                            <p className="text-xs text-slate-400">When library staff request more book copies, alerts will appear here in real time.</p>
                          </div>
                        ) : (
                          restockRequests.map(req => (
                            <div
                              key={req.id}
                              className={`p-6 rounded-3xl bg-slate-900/90 border border-amber-900/50 flex flex-col md:flex-row md:items-center justify-between gap-6 transition-all duration-300 ${
                                disappearingRestockId === req.id ? 'disappearing-item' : 'hover:border-amber-500/60'
                              }`}
                            >
                              <div className="flex items-start gap-4 min-w-0">
                                <div className="w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center shrink-0">
                                  <i data-lucide="bell-ring" className="w-6 h-6 animate-pulse"></i>
                                </div>
                                <div className="min-w-0">
                                  <div className="flex items-center gap-2.5">
                                    <h3 className="font-extrabold text-base text-white truncate">{req.bookTitle}</h3>
                                    <span className="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40">
                                      +5 Copies Requested
                                    </span>
                                  </div>
                                  <p className="text-xs text-slate-300 mt-1">Author: {req.author} • Category: {req.category}</p>
                                  <div className="flex items-center gap-3 mt-2 text-xs text-slate-400">
                                    <span>Requested by Staff: <strong className="text-amber-300 font-semibold">{req.requestedBy}</strong> ({req.empId})</span>
                                    <span>•</span>
                                    <span>{req.requestedAt}</span>
                                  </div>
                                </div>
                              </div>

                              <div className="flex items-center gap-3 shrink-0 pt-3 md:pt-0 border-t md:border-t-0 border-slate-800">
                                <button
                                  onClick={() => handleAdminExecuteRestock(req)}
                                  className="px-5 py-2.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-lg shadow-emerald-600/30 flex items-center gap-2 transition active:scale-95"
                                >
                                  <i data-lucide="plus-circle" className="w-4 h-4"></i>
                                  <span>Approve & Restock (+5 Copies)</span>
                                </button>
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  )}

                  {/* 2. ADMIN STUDENT BORROW REQUESTS */}
                  {activeTab === 'admin_requests' && (
                    <div className="space-y-8 max-w-5xl mx-auto">
                      <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                          <h2 className="text-2xl font-extrabold text-white flex items-center gap-3">
                            <span>Student Borrow Requests</span>
                            {pendingBorrowRequestsCount > 0 && (
                              <span className="text-xs bg-rose-500 text-white font-bold px-3 py-1 rounded-full animate-pulse">
                                {pendingBorrowRequestsCount} Action Required
                              </span>
                            )}
                          </h2>
                          <p className="text-slate-400 text-sm mt-1">
                            Review incoming student requests. When you click <strong>Accept</strong> or <strong>Reject</strong>, the item <strong>disappears</strong> and updates the student's status!
                          </p>
                        </div>
                      </div>

                      <div className="space-y-4">
                        {requests.length === 0 ? (
                          <div className="p-12 rounded-3xl bg-slate-900/60 border border-slate-800 text-center space-y-3">
                            <div className="w-12 h-12 rounded-2xl bg-blue-500/10 text-blue-400 flex items-center justify-center mx-auto">
                              <i data-lucide="check-check" className="w-6 h-6"></i>
                            </div>
                            <h3 className="font-bold text-base text-white">All caught up! No pending student requests.</h3>
                          </div>
                        ) : (
                          requests.map(req => (
                            <div
                              key={req.id}
                              className={`p-6 rounded-3xl bg-slate-900/80 border border-slate-800/80 flex flex-col md:flex-row md:items-center justify-between gap-6 transition-all duration-300 ${
                                disappearingReqId === req.id ? 'disappearing-item' : 'hover:border-blue-500/50'
                              }`}
                            >
                              <div className="flex items-start gap-4 min-w-0">
                                <div className="w-12 h-12 rounded-2xl bg-blue-500/20 text-blue-400 flex items-center justify-center shrink-0">
                                  <i data-lucide="mail" className="w-6 h-6"></i>
                                </div>
                                <div className="min-w-0">
                                  <div className="flex items-center gap-2.5">
                                    <h3 className="font-bold text-base text-white truncate">{req.bookTitle}</h3>
                                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300">
                                      Pending Review
                                    </span>
                                  </div>
                                  <p className="text-xs text-slate-300 mt-1">Author: {req.author}</p>
                                  <div className="flex items-center gap-3 mt-2 text-xs text-slate-400">
                                    <span>Requested by: <strong className="text-white">{req.studentName}</strong> ({req.studentRoll})</span>
                                    <span>•</span>
                                    <span>{req.requestedAt}</span>
                                  </div>
                                </div>
                              </div>

                              <div className="flex items-center gap-3 shrink-0 pt-3 md:pt-0 border-t md:border-t-0 border-slate-800">
                                <button
                                  onClick={() => handleAdminReject(req)}
                                  className="px-4 py-2 rounded-2xl bg-slate-800 hover:bg-slate-700 text-rose-300 text-xs font-bold border border-rose-900/40 transition active:scale-95"
                                >
                                  Reject
                                </button>
                                <button
                                  onClick={() => handleAdminApprove(req)}
                                  className="px-5 py-2 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-lg shadow-emerald-600/30 flex items-center gap-1.5 transition active:scale-95"
                                >
                                  <i data-lucide="check" className="w-4 h-4"></i>
                                  <span>Accept & Approve (Issue)</span>
                                </button>
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  )}

                  {/* 3. ADMIN EMPLOYEE ATTENDANCE REGISTRY */}
                  {activeTab === 'admin_emp_attendance' && (
                    <div className="space-y-6 max-w-6xl mx-auto">
                      <div>
                        <h2 className="text-2xl font-extrabold text-white flex items-center gap-3">
                          <span>Library Staff & Employee Attendance Ledger</span>
                          <span className="text-xs bg-amber-500/20 text-amber-300 px-3 py-1 rounded-full font-bold">Admin Duty Monitor</span>
                        </h2>
                        <p className="text-slate-400 text-sm mt-1">
                          Verified audit of all library staff members, duty check-in/out timestamps, and assigned shifts.
                        </p>
                      </div>

                      <div className="rounded-3xl bg-slate-900/80 border border-slate-800/80 overflow-hidden shadow-xl">
                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-xs">
                            <thead className="bg-slate-950 text-slate-400 uppercase font-semibold text-[10px] tracking-wider border-b border-slate-800">
                              <tr>
                                <th className="p-4">Staff Name & Designation</th>
                                <th className="p-4">Employee ID</th>
                                <th className="p-4">Duty Status</th>
                                <th className="p-4">Time Recorded</th>
                                <th className="p-4">Assigned Shift</th>
                                <th className="p-4 text-right">Date</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800/60">
                              {employeeAttendanceLogs.map(empLog => (
                                <tr key={empLog.id} className="hover:bg-slate-800/40 transition">
                                  <td className="p-4 font-bold text-white flex items-center gap-2">
                                    <div className="w-7 h-7 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-[10px] font-bold">
                                      ST
                                    </div>
                                    <div>
                                      <p className="font-bold text-white">{empLog.empName}</p>
                                      <p className="text-[10px] text-slate-400">{empLog.designation}</p>
                                    </div>
                                  </td>
                                  <td className="p-4 font-mono text-indigo-300 font-semibold">{empLog.empId}</td>
                                  <td className="p-4">
                                    <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                                      empLog.type.includes('CHECK-IN') ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'
                                    }`}>
                                      {empLog.type}
                                    </span>
                                  </td>
                                  <td className="p-4 font-bold text-amber-300">{empLog.time}</td>
                                  <td className="p-4 text-slate-300">{empLog.shift}</td>
                                  <td className="p-4 text-right text-slate-400">{empLog.date}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* 4. MASTER CATALOG & RESTOCK */}
                  {activeTab === 'admin_inventory' && (
                    <div className="space-y-6 max-w-7xl mx-auto">
                      <div>
                        <h2 className="text-2xl font-extrabold text-white">Stock Management & Master Catalog</h2>
                        <p className="text-slate-400 text-sm">Monitor stock across Education, Current Affairs, Govt Jobs & Literature.</p>
                      </div>

                      <div className="rounded-3xl bg-slate-900/80 border border-slate-800/80 overflow-hidden shadow-xl">
                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-xs">
                            <thead className="bg-slate-950 text-slate-400 uppercase font-semibold text-[10px] tracking-wider border-b border-slate-800">
                              <tr>
                                <th className="p-4">Book & Author</th>
                                <th className="p-4">Category</th>
                                <th className="p-4">Shelf Rack</th>
                                <th className="p-4">Available / Total</th>
                                <th className="p-4">Stock Status</th>
                                <th className="p-4 text-right">Quick Restock</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800/60">
                              {filteredBooks.map(b => (
                                <tr key={b.id} className="hover:bg-slate-800/40 transition">
                                  <td className="p-4 max-w-xs">
                                    <p className="font-bold text-white text-sm truncate">{b.title}</p>
                                    <p className="text-slate-400 text-xs mt-0.5">{b.author}</p>
                                  </td>
                                  <td className="p-4">
                                    <span className="px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 text-[10px] font-semibold">
                                      {b.category}
                                    </span>
                                  </td>
                                  <td className="p-4 font-semibold text-amber-400">{b.shelf}</td>
                                  <td className="p-4">
                                    <span className="font-bold text-white">{b.availableCopies}</span>
                                    <span className="text-slate-500"> / {b.copies} copies</span>
                                  </td>
                                  <td className="p-4">
                                    <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                                      b.availableCopies === 0 ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30 animate-pulse' :
                                      b.availableCopies <= 2 ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' :
                                      'bg-emerald-500/20 text-emerald-300'
                                    }`}>
                                      {b.availableCopies === 0 ? 'Out of Stock' : b.availableCopies <= 2 ? 'Low Stock' : 'In Stock'}
                                    </span>
                                  </td>
                                  <td className="p-4 text-right">
                                    <button
                                      onClick={() => handleAdminExecuteRestock({ id: 'quick-' + b.id, bookId: b.id, bookTitle: b.title, addedCopies: 5 })}
                                      className="px-3 py-1.5 rounded-xl bg-blue-600/80 hover:bg-blue-600 text-white font-semibold text-xs transition flex items-center gap-1.5 ml-auto"
                                    >
                                      <i data-lucide="plus-circle" className="w-3.5 h-3.5"></i>
                                      <span>Restock (+5)</span>
                                    </button>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* 5. STUDENT ATTENDANCE REGISTER */}
                  {activeTab === 'admin_attendance' && (
                    <div className="space-y-6 max-w-6xl mx-auto">
                      <div>
                        <h2 className="text-2xl font-extrabold text-white">Student Gate Attendance Log</h2>
                        <p className="text-slate-400 text-sm">Real-time attendance ledger showing Student Name, ID, and Exact Time.</p>
                      </div>

                      <div className="rounded-3xl bg-slate-900/80 border border-slate-800/80 overflow-hidden shadow-xl">
                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-xs">
                            <thead className="bg-slate-950 text-slate-400 uppercase font-semibold text-[10px] tracking-wider border-b border-slate-800">
                              <tr>
                                <th className="p-4">Student Name</th>
                                <th className="p-4">Roll Number</th>
                                <th className="p-4">Scan Event</th>
                                <th className="p-4">Timestamp</th>
                                <th className="p-4">Date</th>
                                <th className="p-4 text-right">Status</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800/60">
                              {attendanceLogs.map(log => (
                                <tr key={log.id} className="hover:bg-slate-800/40 transition">
                                  <td className="p-4 font-bold text-white">{log.studentName}</td>
                                  <td className="p-4 text-indigo-300 font-mono font-semibold">{log.studentRoll}</td>
                                  <td className="p-4">
                                    <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                                      log.type === 'CHECK-IN' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'
                                    }`}>
                                      {log.type === 'CHECK-IN' ? '✓ Gate Check-In' : '🚪 Gate Check-Out'}
                                    </span>
                                  </td>
                                  <td className="p-4 text-amber-400 font-bold">{log.time}</td>
                                  <td className="p-4 text-slate-400">{log.date}</td>
                                  <td className="p-4 text-right font-semibold text-slate-300">{log.status}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* 6. FINES & OVERDUE */}
                  {activeTab === 'admin_fines' && (
                    <div className="space-y-6 max-w-6xl mx-auto">
                      <div>
                        <h2 className="text-2xl font-extrabold text-white">Overdue Loans & Daily ₹20 Fine Ledger</h2>
                        <p className="text-slate-400 text-sm">Calculated at ₹20 per day after the 2-day loan period expires.</p>
                      </div>

                      <div className="rounded-3xl bg-slate-900/80 border border-slate-800/80 overflow-hidden shadow-xl">
                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-xs">
                            <thead className="bg-slate-950 text-slate-400 uppercase font-semibold text-[10px] tracking-wider border-b border-slate-800">
                              <tr>
                                <th className="p-4">Loan ID</th>
                                <th className="p-4">Student</th>
                                <th className="p-4">Book Title</th>
                                <th className="p-4">Borrow Date</th>
                                <th className="p-4">Due Date</th>
                                <th className="p-4">Overdue Days</th>
                                <th className="p-4 text-right">Fine Total (₹20/Day)</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800/60">
                              {activeLoans.map(loan => {
                                const { fine, overdueDays, isOverdue } = calculateFine(loan.borrowDate);
                                return (
                                  <tr key={loan.id} className="hover:bg-slate-800/40 transition">
                                    <td className="p-4 font-mono text-slate-400">{loan.id}</td>
                                    <td className="p-4 font-bold text-white">{loan.studentName} ({loan.studentRoll})</td>
                                    <td className="p-4 text-slate-200">{loan.bookTitle}</td>
                                    <td className="p-4 text-slate-400">{loan.borrowDate}</td>
                                    <td className="p-4 text-amber-400 font-semibold">{loan.dueDate}</td>
                                    <td className="p-4">
                                      <span className={`px-2 py-0.5 rounded font-bold ${
                                        isOverdue ? 'text-rose-400 bg-rose-950/60' : 'text-emerald-400 bg-emerald-950/60'
                                      }`}>
                                        {isOverdue ? `${overdueDays} Days Late` : 'On Schedule'}
                                      </span>
                                    </td>
                                    <td className="p-4 text-right font-extrabold text-sm text-rose-400">
                                      ₹{fine}
                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}
                </>
              )}

            </main>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
